<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00b88a"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#00e5a0" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Logo "V" -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#accent)"/>
    <path d="M22 28 L42 28 L50 75 L58 28 L78 28 L62 90 L38 90 Z"
          fill="#0d1117"/>
    <circle cx="78" cy="22" r="6" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Brand name -->
  <text x="240" y="240" font-family="Syne, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    Vértice Digital
  </text>
  <text x="240" y="290" font-family="DM Sans, sans-serif" font-size="28" font-weight="400" fill="#00e5a0">
    Tecnología para Guanacaste · Costa Rica
  </text>

  <!-- Tagline -->
  <text x="100" y="410" font-family="Syne, sans-serif" font-size="48" font-weight="600" fill="#ffffff">
    Asistentes IA · Sitios Web · Automatización
  </text>

  <!-- Services pills -->
  <g transform="translate(100, 460)" font-family="DM Sans, sans-serif" font-size="20" font-weight="500">
    <g>
      <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(0,229,160,0.15)" stroke="#00e5a0" stroke-width="1"/>
      <text x="90" y="31" text-anchor="middle" fill="#00e5a0">🤖 Aria IA 24/7</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="170" height="48" rx="24" fill="rgba(0,229,160,0.15)" stroke="#00e5a0" stroke-width="1"/>
      <text x="85" y="31" text-anchor="middle" fill="#00e5a0">🌐 Sitios Web</text>
    </g>
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="200" height="48" rx="24" fill="rgba(0,229,160,0.15)" stroke="#00e5a0" stroke-width="1"/>
      <text x="100" y="31" text-anchor="middle" fill="#00e5a0">📱 WhatsApp Bot</text>
    </g>
    <g transform="translate(610, 0)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="rgba(0,229,160,0.15)" stroke="#00e5a0" stroke-width="1"/>
      <text x="110" y="31" text-anchor="middle" fill="#00e5a0">⚡ Automatización</text>
    </g>
  </g>

  <!-- URL -->
  <text x="100" y="580" font-family="DM Sans, monospace" font-size="22" font-weight="500" fill="#94a3b8">
    www.verticedigital.space
  </text>
  <text x="1100" y="580" text-anchor="end" font-family="DM Sans, sans-serif" font-size="20" fill="#94a3b8">
    +506 8751-8055
  </text>
</svg>
