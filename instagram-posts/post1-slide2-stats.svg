<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font-family: 'Syne', sans-serif; font-weight: 800; fill: white; }
      .body { font-family: 'DM Sans', sans-serif; font-weight: 400; fill: #c0c0d0; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <text x="80" y="120" font-family="DM Sans" font-size="20" font-weight="500" fill="#00e5a0" letter-spacing="6">DATOS QUE NO TE CUENTAN</text>

  <!-- Stat 1 -->
  <text class="title" x="80" y="280" font-size="140" fill="#00e5a0">78%</text>
  <text class="body" x="80" y="330" font-size="26">de huéspedes esperan</text>
  <text class="body" x="80" y="365" font-size="26">respuesta en menos de 1 hora.</text>

  <!-- Stat 2 -->
  <text class="title" x="80" y="540" font-size="140" fill="#00e5a0">42%</text>
  <text class="body" x="80" y="590" font-size="26">abandona la reserva</text>
  <text class="body" x="80" y="625" font-size="26">si demora más de 24 horas.</text>

  <!-- Stat 3 -->
  <text class="title" x="80" y="800" font-size="140" fill="#00e5a0">65%</text>
  <text class="body" x="80" y="850" font-size="26">de las consultas llegan</text>
  <text class="body" x="80" y="885" font-size="26">FUERA de horario laboral.</text>

  <text x="80" y="1010" font-family="DM Sans" font-size="18" fill="#6b6b8a">Fuente: Booking.com Travel Report 2024</text>
  <text x="900" y="1020" font-family="DM Sans" font-size="22" fill="#6b6b8a" text-anchor="end">2 / 3</text>
</svg>
