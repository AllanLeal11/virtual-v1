<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&amp;family=DM+Sans:wght@400;500&amp;display=swap');
      .title { font-family: 'Syne', sans-serif; font-weight: 800; fill: white; }
      .body { font-family: 'DM Sans', sans-serif; font-weight: 400; fill: #c0c0d0; }
      .accent { fill: #00e5a0; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <text x="80" y="120" font-family="DM Sans" font-size="20" font-weight="500" fill="#00e5a0" letter-spacing="6">VÉRTICE DIGITAL</text>

  <text class="title" x="80" y="320" font-size="72">Tu hotel</text>
  <text class="title" x="80" y="410" font-size="72">está perdiendo</text>
  <text class="title" x="80" y="500" font-size="72" fill="#00e5a0">reservas</text>

  <text class="title" x="80" y="640" font-size="120" fill="#00e5a0">a las 11pm.</text>

  <line x1="80" y1="780" x2="200" y2="780" stroke="#00e5a0" stroke-width="3"/>

  <text class="body" x="80" y="840" font-size="28">Y tampoco contestás</text>
  <text class="body" x="80" y="880" font-size="28">los mensajes en inglés</text>
  <text class="body" x="80" y="920" font-size="28">de tus huéspedes europeos.</text>

  <text x="80" y="1020" font-family="DM Sans" font-size="22" fill="#6b6b8a">Desliza →</text>
  <text x="900" y="1020" font-family="DM Sans" font-size="22" fill="#6b6b8a" text-anchor="end">1 / 3</text>
</svg>
